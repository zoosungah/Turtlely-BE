version: '3.8'
services:
  turtlely-app:
    # 도커 허브 아이디(sy0215)를 직접 적어서 에러를 방지
    image: sy0215/turtlely-app:latest
    container_name: turtlely-container
    ports:
      - "8080:8080"
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}