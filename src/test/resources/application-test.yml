spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile
jwt:
  secret: test-secret-long-enough-for-hs256-which-is-at-least-32-chars!!
  access-token-validity-in-seconds: 1800
  refresh-token-validity-in-seconds: 86400
openai:
  secret-key: test-secret
coolsms:
  api:
    key: test-key
    secret: test-secret
  from: 01000000000
